name: Build on IBM i

# The runner is self-hosted and lives INSIDE your network. GitHub never reaches
# the IBM i; the runner polls GitHub outbound, then connects to the box locally.
# The SSH key is read off the runner's disk at run time, so no IBM i credential
# is ever stored in GitHub.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, ibmi]

    env:
      IBMI_HOST: ${{ vars.IBMI_HOST }}
      IBMI_USER: ${{ vars.IBMI_USER }}
      IBMI_SSH_PORT: 22
      SSH_KEY_NAME: ibmi_demo

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install ibmi-ci
        run: npm install -g @ibm/ibmi-ci

      - name: Decide the target library and remote path
        id: target
        run: |
          # main builds into FLGDEV; every other branch gets its own library,
          # so two branches never fight over one set of objects.
          #
          # On a pull_request event GITHUB_REF_NAME is the MERGE REF ("1/merge"),
          # not the branch - which would name the library FLG1MERGE and collide
          # across unrelated PRs. GITHUB_HEAD_REF holds the real source branch on
          # a PR and is empty otherwise, so prefer it when it is set.
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            LIB=FLGDEV
          else
            LIB=$(printf 'FLG%s' "$BRANCH" | tr -cd '[:alnum:]' \
                  | cut -c1-10 | tr '[:lower:]' '[:upper:]')
          fi
          echo "branch=$BRANCH"

          echo "lib=$LIB" >> "$GITHUB_OUTPUT"
          echo "remote=./ci/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Building into library $LIB"

      - name: Build on the IBM i
        run: |
          LIB='${{ steps.target.outputs.lib }}'
          REMOTE='${{ steps.target.outputs.remote }}'
          ABS="/home/$IBMI_USER/${REMOTE#./}"

          # The key is read from the runner's own disk. It is never stored in
          # GitHub, and IBMI_PRIVATE_KEY wants the key CONTENTS, not a path.
          KEY="$HOME/.ssh/$SSH_KEY_NAME"
          test -f "$KEY" || { echo "::error::SSH key not found at $KEY"; exit 1; }
          export IBMI_PRIVATE_KEY="$(cat "$KEY")"

          # TOBi owns the compiled objects. The data model does not fit its
          # one-target-per-object model (01_tables.sql creates three tables, two
          # triggers and a view in one file), so the DDL and journaling stay as
          # CL steps here. That split is deliberate, not a workaround.
          ici \
            --rcwd "$REMOTE" \
            --push "." \
            --ignore --cl "CRTLIB LIB($LIB) TEXT('CI build')" \
            --cl "RUNSQLSTM SRCSTMF('$ABS/src/ddl/01_tables.sql') COMMIT(*NONE) DFTRDBCOL($LIB)" \
            --cl "RUNSQLSTM SRCSTMF('$ABS/src/ddl/02_procedures.sql') COMMIT(*NONE) DFTRDBCOL($LIB)" \
            --ignore --cl "CRTJRNRCV JRNRCV($LIB/FLAGRCV0)" \
            --ignore --cl "CRTJRN JRN($LIB/QSQJRN) JRNRCV($LIB/FLAGRCV0)" \
            --ignore --cl "STRJRNPF FILE($LIB/FLAGDEF $LIB/FLAGUSR) JRN($LIB/QSQJRN) IMAGES(*BOTH)" \
            --ignore --cl "CRTBNDDIR BNDDIR($LIB/FLAGBND)" \
            --cmd "export PATH=/QOpenSys/pkgs/bin:\$PATH && cd $ABS && OBJLIB=$LIB makei build"

      - name: Clean up the staged source
        if: always()
        run: |
          REMOTE='${{ steps.target.outputs.remote }}'
          export IBMI_PRIVATE_KEY="$(cat "$HOME/.ssh/$SSH_KEY_NAME")"
          ici --cmd "rm -rf $REMOTE" || true
