name: Build on IBM i

# The runner is self-hosted and lives INSIDE your network. GitHub never reaches
# the IBM i; the runner polls GitHub outbound, then connects to the box locally.
# The SSH key stays on the runner, so no IBM i credential is stored in GitHub.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, ibmi]

    env:
      IBMI_HOST: ${{ vars.IBMI_HOST }}
      IBMI_USER: ${{ vars.IBMI_USER }}
      # NOTE: must be an absolute path. A quoted variable holding "~"
      # is not tilde-expanded by the shell, so $HOME is resolved per step.
      SSH_KEY_NAME: ibmi_demo

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Decide the target library and remote path
        id: target
        run: |
          # main builds into FLGDEV; every other branch gets its own library,
          # so two branches never fight over one set of objects.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            LIB=FLGDEV
          else
            LIB=$(printf 'FLG%s' "${GITHUB_REF_NAME}" | tr -cd '[:alnum:]' \
                  | cut -c1-10 | tr '[:lower:]' '[:upper:]')
          fi
          REMOTE="/home/${IBMI_USER}/ci/${GITHUB_RUN_ID}"
          echo "lib=$LIB"       >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "Building into library $LIB from $REMOTE"

      - name: Copy the source to the IBM i
        run: |
          REMOTE='${{ steps.target.outputs.remote }}'
          KEY="$HOME/.ssh/$SSH_KEY_NAME"
          echo "runner user : $(whoami)"
          echo "key path    : $KEY"
          test -f "$KEY" || { echo "::error::SSH key not found at $KEY"; exit 1; }
          ssh -i "$KEY" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes -o ConnectTimeout=10 \
              "$IBMI_USER@$IBMI_HOST" "echo SSH-OK" \
            || { echo "::error::SSH to $IBMI_USER@$IBMI_HOST failed"; exit 1; }
          # COPYFILE_DISABLE keeps macOS from shipping ._AppleDouble files.
          # PASE tar is AIX tar: no -z, so send it uncompressed.
          COPYFILE_DISABLE=1 tar cf - \
            --exclude='.git' --exclude='.env' --exclude='.DS_Store' . \
          | ssh -i "$HOME/.ssh/$SSH_KEY_NAME" -o BatchMode=yes -o StrictHostKeyChecking=no \
                -o IdentitiesOnly=yes "$IBMI_USER@$IBMI_HOST" \
                "rm -rf $REMOTE && mkdir -p $REMOTE && cd $REMOTE && tar xf -"

      - name: Compile the build program
        run: |
          REMOTE='${{ steps.target.outputs.remote }}'
          LIB='${{ steps.target.outputs.lib }}'
          ssh -i "$HOME/.ssh/$SSH_KEY_NAME" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes "$IBMI_USER@$IBMI_HOST" \
              "system \"CRTLIB LIB($LIB) TEXT('CI build')\" >/dev/null 2>&1;
               system \"CRTBNDCL PGM($LIB/BUILDDEMO) SRCSTMF('$REMOTE/build/BUILDDEMO.clle')\""

      - name: Build
        run: |
          REMOTE='${{ steps.target.outputs.remote }}'
          LIB='${{ steps.target.outputs.lib }}'
          # BUILDDEMO's ROOT parameter is CHAR(256); a short literal would leave
          # the program reading past the end of the value, so pad it.
          ROOT_PADDED=$(printf '%-256s' "$REMOTE")
          LIB_PADDED=$(printf '%-10s' "$LIB")
          ssh -i "$HOME/.ssh/$SSH_KEY_NAME" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes "$IBMI_USER@$IBMI_HOST" \
              "system \"CALL PGM($LIB/BUILDDEMO) PARM('$ROOT_PADDED' '$LIB_PADDED')\"" \
            | tee build.log
          # The CL signals failure by escaping, which surfaces as CEE9901.
          if grep -qE 'CEE9901|RNS931|not created' build.log; then
            echo "::error::Build failed on the IBM i — see the log above"
            exit 1
          fi

      - name: Verify the objects are the ones we just built
        run: |
          LIB='${{ steps.target.outputs.lib }}'
          ssh -i "$HOME/.ssh/$SSH_KEY_NAME" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes "$IBMI_USER@$IBMI_HOST" \
              "system \"RUNSQL SQL('CREATE OR REPLACE TABLE QTEMP.CIOUT AS (SELECT OBJNAME, OBJTYPE, OBJCREATED FROM TABLE(QSYS2.OBJECT_STATISTICS(''$LIB'', ''*ALL'')) WHERE OBJNAME LIKE ''DEMO%'') WITH DATA') COMMIT(*NONE)\" >/dev/null 2>&1;
               system \"RUNQRY QRYFILE((QTEMP/CIOUT))\"" | grep -E 'DEMO|OBJNAME' | head -6

      - name: Clean up the staged source
        if: always()
        run: |
          REMOTE='${{ steps.target.outputs.remote }}'
          ssh -i "$HOME/.ssh/$SSH_KEY_NAME" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes "$IBMI_USER@$IBMI_HOST" \
              "rm -rf $REMOTE" || true
